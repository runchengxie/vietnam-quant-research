name: Quant showcase

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/showcase-pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bootstrap showcase lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/japan-vietnam-showcase'
        working-directory: .
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- site/package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json
          git commit -m "build: lock showcase dependencies"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Test
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify relocatable artifact
        run: |
          ! grep -R "guan-japanese-nira" dist
          grep -Eq '(src|href)="\./assets/' dist/index.html

  python-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest -q

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, python-baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
