[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-quant-research"
version = "0.1.0"
description = "Auditable daily data loop for Vietnam equity research"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "requests>=2.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
